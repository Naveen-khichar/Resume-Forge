# Simple workflow for deploying a static redirect page to GitHub Pages
name: Deploy Redirect to Pages

on:
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Deploy redirect job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Create Redirect Page
        run: |
          mkdir -p out
          cat << 'EOF' > out/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <!-- Change the URL below to your actual Vercel URL once deployed -->
            <link rel="canonical" href="https://resume-forge-six.vercel.app">
            <meta http-equiv="refresh" content="0; url=https://resume-forge-six.vercel.app">
            <script type="text/javascript">
              window.location.href = "https://resume-forge-six.vercel.app";
            </script>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background-color: #050507;
                color: #fafafa;
              }
              .container {
                text-align: center;
                padding: 2rem;
                background: rgba(9, 9, 11, 0.7);
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.05);
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
              }
              h1 {
                font-size: 1.8rem;
                margin-bottom: 0.5rem;
                background: linear-gradient(to right, #8b5cf6, #3b82f6);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
              }
              p {
                color: #a1a1aa;
                margin-bottom: 1.5rem;
              }
              a {
                color: #8b5cf6;
                text-decoration: none;
                font-weight: 500;
              }
              a:hover {
                text-decoration: underline;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Redirecting to ResumeForge</h1>
              <p>Please wait while we redirect you to the application.</p>
              <p>If you are not redirected automatically, <a href="https://resume-forge-six.vercel.app">click here to proceed</a>.</p>
            </div>
          </body>
          </html>
          EOF
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
